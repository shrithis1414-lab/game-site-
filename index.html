 <!DOCTYPE html>
<html lang="en">
<head>
    <title>Game Login</title>
</head>
<body>

    <header>
        <h1> Gamer Zone</h1>
        <p>Enter your details to start playing!</p>
        <hr>
    </header>

    
    <main> 

        <h2>Player Registration</h2>
 
        <form>
            <table>
                <tr>

            <td><label>Username:</label></td>
            
            <td><input type="text" placeholder="Enter Username"></td>
            
</tr>

           <tr>
            <td><label>Email:</label></td>
            
           <td><input type="email" placeholder="Enter Email"> </td> 
            
            </tr>

            <tr>

           <td> <label>Age:</label> </td>
            
           <td> <input type="number" placeholder="Enter Age"> </td>
            
            </tr>
        <tr>


           <td> <label>Password:</label></td>
            
            <td><input type="password" placeholder="Enter Password"></td>
            </tr>
            

           
           </table> 
            <button type="submit">Start Game</button>
        </form>

    </main>

    <br><hr>

    
    <footer>
        <p> Gamer Zone! UNLEASH YOUR INNER REALM</p>
    </footer>

</body>
</html>
